# Tests hum on macOS and Linux for every change under hum/ or hum-engine/, and on main publishes
# @moo.md/hum when its version is not on npm yet. Publishing uses npm trusted publishing: the
# package on npmjs.com trusts this workflow, so the repo holds no npm token.
name: hum

on:
  push:
    branches: [main]
    paths: &paths
      - hum/**
      - hum-engine/**
      - .claude-plugin/marketplace.json
      - .github/workflows/hum.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: hum-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: hum
      - run: bun install --frozen-lockfile
        working-directory: hum-engine
      - run: bun run lint
        working-directory: hum
      - run: bun run typecheck
        working-directory: hum-engine
      - run: bun run lint
        working-directory: hum-engine
      - run: bun run test
        working-directory: hum-engine

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: hum-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - id: release
        run: bun run release:check
      # Trusted publishing needs npm 11.5.1 or later.
      - if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@^11.5.1
      - if: steps.release.outputs.publish == 'true'
        run: bun run release:surface
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git tag "hum@$VERSION"
          git push origin "hum@$VERSION"
