# Builds site/ and publishes it to GitHub Pages at saadshahd.github.io/moo.md.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Switzer's licence forbids it in a public repo, so the prebuild step
      # fetches it from Fontshare. The cache keeps deploys off Fontshare
      # until the fetch script changes; a failed cold fetch fails the build.
      # The site ships as a Pages artifact, never a branch, so the font file
      # lands in no public branch.
      - uses: actions/cache@v6
        with:
          path: site/src/fonts
          key: fonts-${{ hashFiles('site/tools/fetch-fonts.mjs') }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
