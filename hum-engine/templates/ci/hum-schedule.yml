# The scheduled workflow does in CI what the service unit does on a Mac: it polls the answers
# integration, fires saved timeouts, shows provider failures as annotations, and records its tick (R2).
name: hum on schedule

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: hum-wake
  cancel-in-progress: false

jobs:
  wake:
    uses: ./.github/workflows/hum-wake.yml
    secrets: inherit
