# An answer on a GitHub issue or PR thread wakes a run.
name: hum on comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: hum-wake
  cancel-in-progress: false

jobs:
  wake:
    if: github.event.comment.user.type != 'Bot'
    uses: ./.github/workflows/hum-wake.yml
    secrets: inherit
